<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudflare AI Security — Demo</title>
    <script>
      // Set the saved theme before first paint (no flash). No choice → OS default.
      (function () {
        try {
          var t = localStorage.getItem('cf-demo-theme');
          var dark =
            t === 'dark' ||
            (!t && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
